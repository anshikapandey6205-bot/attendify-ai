<!DOCTYPE html>
<html>
<head>
    <title>Attendify AI - Login</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="login-page">

<div class="login-card">

    <div class="logo">◉</div>

    <h1>Attendify AI</h1>

    <p>Smart Attendance. Simple Management.</p>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <small>
        Demo: admin / admin123
    </small>

</div>

</body>
</html>
